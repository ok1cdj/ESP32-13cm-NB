# NB TRX (android/): the APK, only for a tag v* (e.g. v0.2): a GitHub release (latest) with the APK and its SHA-256, or by hand
# (workflow_dispatch: the APK as a workflow artifact). Not on every push: the app takes the page from the web (PageFiles),
# a new app is needed only when the bridge changes.
# Release signing (own key, ~/.android-keys/nbtrx-release.jks of OK1CDJ) needs the secrets KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD;
# without them a debug APK is built instead.
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # git describe for the version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=$(git describe --tags --always)-ci; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            { echo "NBTRX_KEYSTORE=$RUNNER_TEMP/release.jks"; echo "NBTRX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NBTRX_KEY_ALIAS=$KEY_ALIAS"; echo "NBTRX_KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"
          fi

      - name: APK
        working-directory: android
        run: |
          if [ -n "$NBTRX_KEYSTORE" ]; then task=assembleRelease; dir=release; else task=assembleDebug; dir=debug; fi
          ./gradlew --no-daemon "$task" -PappVersion="$APP_VERSION" -PappCode="${{ github.run_number }}"
          mkdir -p ../dist
          cp "app/build/outputs/apk/$dir/app-$dir.apk" "../dist/nbtrx-$APP_VERSION.apk"
          cd ../dist && sha256sum ./*.apk > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: nbtrx-${{ env.APP_VERSION }}
          path: dist/

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notes: this version's section of CHANGELOG.md (the app shows them in its update offer), then the standing text
          awk -v v="$APP_VERSION" '/^## / { on = ($2 == v); next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          printf '\n---\nNB TRX: the USB bridge app for the 13 cm narrowband page (ESP32-S3 receiver, ESP32-C3 transmitter on USB OTG; Android 9+). The page itself comes from https://ok1cdj.github.io/ESP32-13cm-NB/ and is kept for offline use. Licensed radio amateurs only. SHA-256 in SHA256SUMS.\n' >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --latest --title "NB TRX $APP_VERSION" --notes-file "$RUNNER_TEMP/notes.md"
