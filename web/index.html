<!doctype html>
<!-- NB 13 cm receiver: ESP32-S3 (ESP-SDR IQS firmware) with spectrum, waterfall and CW audio; C3 CW beacon control.
     tools/web_bridge.py serves it and passes the boards over WebSocket (any browser): http://localhost:8080
     ?webserial or tools/web_serve.py: Web Serial (Chrome / Edge on http://localhost). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NB 13 cm receiver</title>
<style>
  :root { --bg: #15171a; --panel: #1f2226; --text: #d8dadd; --dim: #8a9097; --acc: #ff9f0a; --line: #33373c; --ok: #4cd964; --err: #ff453a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  header .freq { font: 600 22px/1 ui-monospace, monospace; color: var(--acc); }
  main { padding: 8px 16px; display: grid; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--panel); padding: 8px 10px; border-radius: 6px; }
  .row b { min-width: 28px; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  input, select, button { background: #2a2e33; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
  input[type=number] { width: 8em; }
  input.w5 { width: 5em; }
  button { cursor: pointer; }
  button.on { border-color: var(--acc); color: var(--acc); }
  button:disabled { opacity: .45; cursor: default; }
  .stat { font: 12px ui-monospace, monospace; color: var(--dim); }
  .ok { color: var(--ok); } .err { color: var(--err); }
  canvas { width: 100%; display: block; background: #000; }
  #spec { height: 220px; border-radius: 4px 4px 0 0; cursor: crosshair; }
  #axis { height: 26px; background: #101214; }
  #wf { height: 320px; border-radius: 0 0 4px 4px; cursor: crosshair; }
  .plot { display: grid; gap: 0; }
  #log { font: 12px ui-monospace, monospace; color: var(--dim); max-height: 7.5em; overflow: auto; white-space: pre-wrap; background: var(--panel); padding: 6px 10px; border-radius: 6px; }
  .meter { width: 160px; height: 10px; background: #2a2e33; border-radius: 5px; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>NB 13 cm receiver</h1>
  <span>listening <span class="freq" id="lfreq">—</span> MHz</span>
  <span class="stat" id="stats"></span>
</header>
<main>
  <div class="row">
    <b>S3</b>
    <button id="autoconn" title="Find the S3 and the C3 among the ports this page may use (asks for a port only when one is still missing)">Auto connect</button>
    <button id="s3conn">Connect S3</button>
    <span class="stat" id="s3info">not connected</span>
    <label>preset <select id="preset">
      <option value="">—</option>
      <option value="2320.050,2320.050,256">C3 test beacon 2320.050</option>
      <option value="2320.804,2320.804,256">OK0EA 2320.804 JO70UP</option>
      <option value="2320.870,2320.870,256">OK0EK 2320.870 JN89VJ</option>
      <option value="2320.890,2320.890,256">OK0EKL 2320.890 JO60LJ</option>
      <option value="2320.930,2320.930,256">OK0EL 2320.930 JO70SQ</option>
      <option value="2320.970,2320.970,256">OK0EB 2320.970 JN78DU</option>
      <option value="2320.890,2320.804,64">beacon segment 2320.79–2320.99 (250 kS/s)</option>
    </select></label>
    <label>centre <input type="number" id="center" step="0.001" value="2320.050"> MHz</label>
    <label>rate <select id="rate">
      <option value="64,8">250 kS/s · 8 bit</option>
      <option value="128,16">125 kS/s · 16 bit</option>
      <option value="256,16" selected>62.5 kS/s · 16 bit</option>
      <option value="512,16">31.25 kS/s · 16 bit</option>
      <option value="1024,16">15.6 kS/s · 16 bit</option>
    </select></label>
    <label>gain <select id="gainmode"><option value="auto">AGC</option><option value="man">manual</option></select>
      <input type="number" id="gain" class="w5" min="0" max="82" value="60" disabled></label>
    <button id="start" disabled>Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div class="row">
    <b>RX</b>
    <label>mode <select id="mode"><option value="cw" selected>CW</option><option value="usb">USB</option></select></label>
    <label>listen <input type="number" id="listen" step="0.000001" value="2320.050000"> MHz</label>
    <label>filter <select id="bw"></select></label>
    <label id="pitchl">pitch <input type="number" id="pitch" class="w5" value="700"> Hz</label>
    <button id="audio">Audio on</button>
    <label>volume <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7"></label>
    <label>level <div class="meter"><div id="meter"></div></div> <span class="stat" id="level"></span></label>
    <label>zoom <select id="zoom"><option value="1">1×</option><option value="2">2×</option><option value="4" selected>4×</option><option value="8">8×</option><option value="16">16×</option></select></label>
    <label>range <input type="number" id="range" class="w5" value="70"> dB</label>
  </div>
  <div class="plot">
    <canvas id="spec"></canvas>
    <canvas id="axis"></canvas>
    <canvas id="wf"></canvas>
  </div>
  <div class="row">
    <b>C3</b>
    <button id="c3conn">Connect C3</button>
    <span class="stat" id="c3info">not connected</span>
    <button id="cwon" disabled>CW ON</button>
    <button id="cwoff" disabled>CW OFF</button>
    <label>F <input type="number" id="c3f" step="0.001" value="2320.050"> MHz</label>
    <label>AMP <input type="number" id="c3amp" class="w5" min="1" max="480" value="10"> <span class="stat" id="c3dbm"></span></label>
    <button id="c3set" disabled>Apply</button>
    <button id="dccal" disabled title="The C3 sends its LO leakage alone (BDC TEST); the S3 measures it through crosstalk and the DC correction is searched for its minimum. Valid until the C3 resets. Shown with the S3's ceramic antenna next to the C3 only.">Calibrate DC (S3)</button>
    <span class="stat" title="Measured 2026-11-10 with the tinySA (±2 dB): linear to AMP 100, P1dB near AMP 150, at most about +12.5 dBm">dBm at the C3's connector, measured</span>
  </div>
  <div class="row">
    <b>TX</b>
    <label>source <select id="txsrc"><option value="mic">microphone</option><option value="tone">tone</option><option value="two">two tones</option><option value="file">WAV / audio file</option></select></label>
    <label id="txtl">tone <input type="number" id="txt1" class="w5" value="1000"> <input type="number" id="txt2" class="w5" value="1900"> Hz</label>
    <label id="txfl"><input type="file" id="txfile" accept="audio/*"></label>
    <label id="txgl">mic gain <input type="number" id="txgain" class="w5" value="0"> dB</label>
    <button id="ptt" disabled title="Transmit while held, or while the Tab key is held (C3: USB at F, AMP; into a dummy load or an attenuator only)">PTT (hold / Tab)</button>
    <button id="txbtn" disabled>TX on</button>
    <label>out <div class="meter"><div id="txmeter"></div></div></label>
    <span class="stat" id="txinfo"></span>
  </div>
  <div id="log"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
